services:
  - type: web
    name: alhilal-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_PHONE
        value: "01035089566"
      # Add Firebase Admin and API keys in Render Environment, not in this file.

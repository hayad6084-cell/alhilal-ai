function persistProjects(){try{localStorage.setItem('alhilal_projects',JSON.stringify(state.projects))}catch(e){console.warn('project storage',e)}}
function stripProjectBinaries(value){if(Array.isArray(value))return value.map(stripProjectBinaries);if(value&&typeof value==='object'){const o={};for(const [k,v] of Object.entries(value)){if(['audioBase64','blobUrl'].includes(k))continue;if(typeof v==='string'&&v.startsWith('data:'))continue;o[k]=stripProjectBinaries(v)}return o}return value}
function legacy_addProjectRecord(type,name,desc,data,icon='📁'){const safeData=stripProjectBinaries(data||null);const rec={id:'p_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),type,name:name||'مشروع الهلال AI',date:new Date().toLocaleString('ar-EG'),desc:desc||'',icon,data:safeData};state.projects.unshift(rec);persistProjects();return rec}
function projectTypeLabel(t){return ({director:'المخرج الذكي',story:'قصة / بطاقة قصة',voice:'تعليق صوتي',image:'صورة',video:'فيديو',chat:'محادثة'})[t]||'مشروع'}
function openProjectRecord(i){const p=state.projects[i];if(!p)return;document.getElementById('projectViewer')?.remove();const v=document.createElement('div');v.className='viewer';v.id='projectViewer';let body='';try{if(p.type==='director'){const d=normalizeDirectorData(p.data?.data||p.data||{});body=directorSceneText(d)+'\n\n'+directorCharactersText(d)+'\n\n'+directorWorldText(d)}else if(p.type==='story'){const d=normalizeStoryData(p.data?.data||p.data||{});body=storyScenesText(d)+'\n\nالشخصيات\n'+storyCharactersText(d)+'\n\nالأماكن\n'+storyLocationsText(d)}else if(p.type==='voice'){body='النص:\n'+(p.data?.text||'')+'\n\nالصوت: '+(p.data?.voice||'')+'\nالنموذج: '+(p.data?.model||'')}else if(p.type==='image'){body='وصف الصورة:\n'+(p.data?.prompt||'')+'\n\nالنسبة: '+(p.data?.ratio||'')}else if(p.type==='video'){body='وصف الفيديو:\n'+(p.data?.prompt||'')+'\n\nالنموذج: '+(p.data?.model||'')+'\nالمدة: '+(p.data?.duration||p.data?.durationSeconds||'')+' ثانية\nالدقة: '+(p.data?.resolution||'')}else{body=typeof p.data==='string'?p.data:JSON.stringify(p.data||{},null,2)}}catch(e){body=JSON.stringify(p.data||{},null,2)}const img=(p.type==='image'&&/^https?:/i.test(p.data?.src||''))?`<img class="ai-image" src="${escapeHtml(p.data.src)}" alt="">`:'';const fname=String(p.name||'project').replace(/[^\w\u0600-\u06FF\-]+/g,'_');v.innerHTML=`<div class="viewer-card"><div class="viewer-head"><h3>${escapeHtml(p.name)}</h3><button class="viewer-close" type="button" id="pvClose">إغلاق</button></div><div class="viewer-body"><div class="viewer-section"><div class="generated-badge">${projectTypeLabel(p.type)} • ${escapeHtml(p.date||'')}</div>${img}<pre class="viewer-pre">${escapeHtml(body)}</pre></div><div class="mini-actions"><button type="button" class="gold" id="pvDownload">💾 تنزيل الملف</button><button type="button" id="pvPrint">🖨️ طباعة / PDF</button>${p.type==='director'||p.type==='story'?`<button type="button" class="gold" id="pvVideo">🎬 إنشاء فيديو من المشروع — 10 ثوانٍ</button>`:''}${['voice','image','video'].includes(p.type)?`<button type="button" id="pvOpen">فتح الأداة</button>`:''}</div></div></div>`;document.body.appendChild(v);v.addEventListener('click',e=>{if(e.target===v)v.remove()});v.querySelector('#pvClose').onclick=()=>v.remove();v.querySelector('#pvDownload').onclick=()=>downloadTextFile(fname+'.txt',body);v.querySelector('#pvPrint').onclick=()=>printStoryFile(p.name,body);const pv=v.querySelector('#pvVideo');if(pv)pv.onclick=()=>openVideoFromProject(i);const po=v.querySelector('#pvOpen');if(po)po.onclick=()=>{v.remove();nav(p.type)}}
function openVideoFromProject(i){const p=state.projects[i];if(!p){return}let prompt='',sceneCount=1;if(p.type==='director'){const d=p.data?.data||p.data||{};const scenes=Array.isArray(d.scenes)?d.scenes.slice(0,1):[];prompt=scenes.map((s,n)=>`المشهد ${n+1}: ${s.title||''}\nالوصف البصري: ${s.visual||''}\nحركة الكاميرا: ${s.camera||''}\nالحركة: ${s.video_prompt||''}\nالحوار: ${s.dialogue||''}\nالصوت: ${s.sound||''}`).join('\n\n--- انتقال إلى المشهد التالي ---\n\n')}else if(p.type==='story'){const d=p.data?.data||p.data||{};const scenes=Array.isArray(d.dialogue_and_prompts)?d.dialogue_and_prompts.slice(0,1):[];prompt=scenes.map((s,n)=>`المشهد ${n+1}: ${s.scene_title||''}\nالوصف: ${s.scene_description||''}\nالحوار: ${s.dialogue||''}\nVideo Prompt: ${s.video_prompt||''}`).join('\n\n--- انتقال إلى المشهد التالي ---\n\n')}else{alert('زر إنشاء الفيديو من الملف متاح للمخرج الذكي والقصة.');return}if(!prompt.trim()){alert('الملف لا يحتوي على مشاهد كافية لإنشاء فيديو.');return}window.__videoPreset={prompt,sceneCount:1,duration:10};document.getElementById('projectViewer')?.remove();nav('video')}

function applyLocale(){const lang=state.lang||'العربية';const code=LANG_CODES[lang]||'ar';document.documentElement.lang=code;document.documentElement.dir=code==='ar'?'rtl':'ltr';const map=LOCALE_TEXT[lang]||{};if(!Object.keys(map).length)return;const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const n of nodes){const raw=n.nodeValue.trim();if(map[raw])n.nodeValue=n.nodeValue.replace(raw,map[raw]);}document.querySelectorAll('input[placeholder],textarea[placeholder]').forEach(el=>{if(map[el.getAttribute('placeholder')])el.setAttribute('placeholder',map[el.getAttribute('placeholder')])});document.querySelectorAll('[aria-label]').forEach(el=>{if(map[el.getAttribute('aria-label')])el.setAttribute('aria-label',map[el.getAttribute('aria-label')])});}

async function callGemini(prompt,opts={}){
 const key=getGeminiKey();
 if(!key) throw new Error('لم يتم إدخال مفتاح Gemini API من الإعدادات.');
 const preferred=opts.model||getGeminiModel();
 const models=[preferred,...(preferred==='gemini-3.8-flash'?['gemini-3.7-flash']:[])].filter((m,i,a)=>a.indexOf(m)===i);
 let lastError='تعذر الاتصال بـ Gemini API';
 for(const model of models){
  for(let attempt=0;attempt<3;attempt++){
   try{
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{
     method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},
     body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],...(opts.generationConfig?{generationConfig:opts.generationConfig}:{})})
    });
    const data=await res.json().catch(()=>({}));
    if(res.ok){
      const text=(data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('\n').trim();
      if(text)return text;
      throw new Error('لم يرجع النموذج نصًا.');
    }
    const status=res.status;
    lastError=data?.error?.message||`خطأ Gemini (${status})`;
    if(status===429||status===500||status===502||status===503||status===504){
      await new Promise(r=>setTimeout(r,1200*(attempt+1)));
      continue;
    }
    break;
   }catch(e){
    lastError=e?.message||lastError;
    if(attempt<2){await new Promise(r=>setTimeout(r,1200*(attempt+1)));continue;}
   }
  }
 }
 throw new Error(lastError+'\nجرّب مرة أخرى بعد قليل إذا كان Gemini تحت ضغط.');
}

}

async function generateGeminiImage(prompt,aspectRatio='1:1'){
 const key=getGeminiKey();
 if(!key)throw new Error('لم يتم إدخال مفتاح Gemini API.');
 const preferred=getGeminiImageModel();
 const models=[preferred,...(preferred==='gemini-3.1-flash-image'?['gemini-3-pro-image']:['gemini-3.1-flash-image'])].filter((m,i,a)=>a.indexOf(m)===i);
 const ratio=aspectRatio==='16:9'?'16:9':'1:1';
 let lastError='تعذر توليد الصورة';
 for(const model of models){
  try{
   const res=await fetch('https://generativelanguage.googleapis.com/v1beta/interactions',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-goog-api-key':key},
    body:JSON.stringify({
      model,
      input:prompt,
      response_format:{type:'image',mime_type:'image/jpeg',aspect_ratio:ratio,image_size:'1K'}
    })
   });
   const data=await res.json().catch(()=>({}));
   if(!res.ok){lastError=data?.error?.message||`خطأ توليد الصورة (${res.status})`;continue}
   const out=data.output_image;
   if(out?.data)return `data:${out.mime_type||out.mimeType||'image/png'};base64,${out.data}`;
   // Defensive fallback for interleaved output shapes.
   for(const step of (data.steps||[])){
    for(const block of (step.content||[])){
     if(block?.type==='image'&&block?.data)return `data:${block.mime_type||'image/png'};base64,${block.data}`;
    }
   }
   lastError='Gemini استجاب لكن لم يُرجع بيانات صورة.';
  }catch(e){lastError=e?.message||lastError}
 }
 throw new Error(lastError);
}

async function generateLtxVideo(prompt){
 const duration=Number(document.getElementById('videoDuration')?.value||8);
 const resolution0=document.getElementById('videoResolution')?.value||'720p';
 const ratio=document.getElementById('videoRatio')?.value||'16:9';
 const resolution=resolution0==='4k'?(ratio==='9:16'?'2160x3840':'3840x2160'):(resolution0==='1080p'?(ratio==='9:16'?'1080x1920':'1920x1080'):(ratio==='9:16'?'720x1280':'1280x720'));
 const data=await ltxRequest('/api/ltx/video',{prompt,model:getLtxModel(),duration,resolution});
 if(!data?.id) throw new Error('LTX لم يُرجع Job ID.');
 for(let i=0;i<180;i++){
   const d=await ltxRequest('/api/ltx/job',{jobId:data.id}); const status=document.getElementById('videoStatus');
   if(status) status.textContent=`⏳ فيديو LTX قيد التوليد... الحالة: ${d?.status||'processing'}`;

   if(d.status==='failed') throw new Error(d?.error?.message||d?.error||'فشل توليد الفيديو في LTX.');
   await new Promise(r=>setTimeout(r,5000));
 }
 throw new Error('انتهت مهلة انتظار فيديو LTX.');
}

async function generateDirectorImages(data,resultEl){
 const jobs=[];
 data.characters.forEach((x,i)=>jobs.push({kind:'character',index:i,label:`الشخصية ${x.name||i+1}`,prompt:`أنشئ صورة مرجعية سينمائية واقعية للشخصية التالية لاستخدامها في إنتاج فيلم. حافظ على ثبات الملامح والملابس والهوية البصرية. الشخصية: ${x.name||''}. الدور: ${x.role||''}. العمر: ${x.age||''}. الوصف: ${x.description||''}. الملابس: ${x.costume||''}. السمات: ${x.traits||''}. ${x.image_prompt||''}. لقطة شخصية كاملة من الرأس إلى القدم، إضاءة سينمائية، خلفية بسيطة مناسبة لعزل الشخصية، بدون نصوص أو شعارات.`}));
 data.locations.forEach((x,i)=>jobs.push({kind:'location',index:i,label:`المكان ${x.name||i+1}`,prompt:`أنشئ صورة مرجعية سينمائية للمكان التالي لاستخدامه في الفيلم. المكان: ${x.name||''}. الوصف: ${x.description||''}. ${x.image_prompt||''}. لقطة واسعة واضحة، تفاصيل إنتاجية عالية، بدون نصوص أو شعارات.`}));
 data.props.forEach((x,i)=>jobs.push({kind:'prop',index:i,label:`الأداة ${x.name||i+1}`,prompt:`أنشئ صورة منتج سينمائية واضحة للعنصر أو الأداة التالية المستخدمة في القصة. العنصر: ${x.name||''}. الوصف: ${x.description||''}. ${x.image_prompt||''}. اعرض العنصر كاملًا ومنفردًا، خلفية بسيطة مناسبة، تفاصيل واقعية، بدون نصوص أو شعارات.`}));
 data.weapons.forEach((x,i)=>jobs.push({kind:'weapon',index:i,label:`السلاح ${x.name||i+1}`,prompt:`أنشئ صورة مرجعية سينمائية للعنصر التالي باعتباره دعامة خيالية للإنتاج. السلاح/الدعامة: ${x.name||''}. الوصف: ${x.description||''}. ${x.image_prompt||''}. صورة ثابتة للعنصر كاملًا على خلفية بسيطة، بدون استخدام أو عنف أو أشخاص، بدون نصوص أو شعارات.`}));
 const total=jobs.length;
 let done=0,failed=0;
 const CONCURRENCY=2; // صورتان في نفس الوقت
 if(resultEl) resultEl.innerHTML=`<section class="panel" style="margin-top:18px"><h3>🎨 جاري إنشاء الصور تلقائيًا — صورتان في نفس الوقت</h3><p class="muted">الهلال AI يشغّل مهمتي صور بالتوازي لتسريع المخرج الذكي.</p><div class="progress"><div id="directorImageProgress" style="width:0%"></div></div><p id="directorImageStatus" class="muted">0 من ${total} مكتملة</p></section>`;

 async function runJob(job){
  try{
   const img=await generateImageWithFallback(job.prompt,job.kind==='character'?'1:1':'16:9');
   if(job.kind==='character') data.characters[job.index].image_data=img;
   else if(job.kind==='location') data.locations[job.index].image_data=img;
   else if(job.kind==='prop') data.props[job.index].image_data=img;
   else if(job.kind==='weapon') data.weapons[job.index].image_data=img;
  }catch(e){
   failed++;
   if(job.kind==='character') data.characters[job.index].image_error=e?.message||'تعذر توليد الصورة';
   else if(job.kind==='location') data.locations[job.index].image_error=e?.message||'تعذر توليد الصورة';
   else if(job.kind==='prop') data.props[job.index].image_error=e?.message||'تعذر توليد الصورة';
   else if(job.kind==='weapon') data.weapons[job.index].image_error=e?.message||'تعذر توليد الصورة';
  }finally{
   done++;
   const pct=Math.round((done/Math.max(total,1))*100);
   const bar=document.getElementById('directorImageProgress');
   const status=document.getElementById('directorImageStatus');
   if(bar) bar.style.width=pct+'%';
   if(status) status.textContent=`${done} من ${total} مكتملة — جاري تشغيل حتى صورتين في نفس الوقت`;
  }
 }

 for(let i=0;i<jobs.length;i+=CONCURRENCY){
  await Promise.all(jobs.slice(i,i+CONCURRENCY).map(runJob));
 }
 return {done,failed,total};
}

}

async function extractPdfText(file){try{if(!window.pdfjsLib){try{window.pdfjsLib=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs')}catch(e){throw new Error('تعذر تحميل قارئ PDF. يمكنك لصق النص يدويًا.')}}const lib=window.pdfjsLib;if(!lib)throw new Error('قارئ PDF غير متاح.');if(lib.GlobalWorkerOptions&&!lib.GlobalWorkerOptions.workerSrc)lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';const pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise;let out='';for(let i=1;i<=Math.min(pdf.numPages,30);i++){const page=await pdf.getPage(i);const c=await page.getTextContent();out+=`\n[صفحة ${i}]\n`+c.items.map(x=>x.str).join(' ')+'\n'}return out}catch(e){return `\n[ملف PDF: ${file.name}]\nتعذر استخراج النص تلقائيًا: ${e.message}\n`}}

async function adminTestImage(){const out=document.getElementById('adminTestOut');out.style.display='block';out.textContent='⏳ جاري توليد صورة اختبار...';try{const r=await api('/api/image/generate',{method:'POST',body:JSON.stringify({prompt:'a glowing crescent moon over a desert at night, no text, no logos',size:'1024x1024'})});window.__adminImg=r.url;out.innerHTML='🟢 نجح توليد الصورة. <button type="button" class="secondary" onclick="window.open(window.__adminImg,\'_blank\')">عرض الصورة</button>'}catch(e){out.textContent='🔴 '+e.message}}
async function loadAdminPasswordChangeRequests(){const box=document.getElementById('adminPasswordChangeRequests');if(!box)return;try{const d=await api('/api/admin/password-change/requests'),arr=d.requests||[];box.innerHTML=arr.length?arr.map(x=>`<div class="file" style="display:block;margin-bottom:10px"><b>طلب تغيير كلمة المرور</b><p class="muted">${escapeHtml(x.name||'عضو')} • الهاتف: ${escapeHtml(x.phone||'')} • الحساب: ${escapeHtml(x.uid)} • الحالة: ${escapeHtml(x.status)}</p>${x.status==='pending'?`<div class="actions"><button class="primary" onclick="reviewPasswordChange('${escapeHtml(x.id)}',true)">موافقة وتفعيل كلمة المرور الجديدة</button><button class="danger" onclick="reviewPasswordChange('${escapeHtml(x.id)}',false)">رفض الطلب</button></div>`:`<small>تاريخ المراجعة: ${escapeHtml(x.reviewedAt||'')}</small>`}</div>`).join(''):'<p class="muted">لا توجد طلبات تغيير كلمة مرور.</p>'}catch(e){box.textContent='تعذر تحميل الطلبات: '+e.message}}async function reviewPasswordChange(id,approve){if(!confirm(approve?'هل تؤكد تغيير كلمة مرور هذا الحساب؟':'هل تريد رفض الطلب؟'))return;try{await api('/api/admin/password-change/review',{method:'POST',body:JSON.stringify({id,approve})});await loadAdminPasswordChangeRequests();alert(approve?'تم اعتماد كلمة المرور الجديدة. يمكن للمستخدم تسجيل الدخول بها.':'تم رفض الطلب.')}catch(e){alert(e.message)}}
async function loadAdminRedPointRequests(){const box=document.getElementById('adminRedPointRequests');if(!box)return;try{const d=await api('/api/admin/red-points/requests'),arr=d.requests||[];box.innerHTML=arr.length?arr.map(x=>`<div class="file" style="display:block;margin-bottom:10px"><b>${x.type==='sell'?'💸 طلب سحب':'🔴 طلب الحصول على نقاط'}</b><p class="muted">${escapeHtml(x.phone||'بدون رقم')} • الحساب: ${escapeHtml(x.uid)} • العدد: ${Number(x.amount)} • ${escapeHtml(x.status)}</p>${x.status==='pending'?`<div class="actions">${x.type==='get'?`<label>عدد النقاط الممنوحة <input id="redReqAward${escapeHtml(x.id)}" type="number" min="1" value="${Number(x.amount)}" class="auth-input" style="max-width:140px"></label>`:''}<button class="primary" onclick="reviewRedPointRequest('${escapeHtml(x.id)}',true)">${x.type==='sell'?'موافقة وخصم الرصيد':'موافقة وإضافة النقاط'}</button><button class="danger" onclick="reviewRedPointRequest('${escapeHtml(x.id)}',false)">رفض الطلب</button></div>`:`<p>تمت المراجعة: ${escapeHtml(x.reviewedAt||'')} ${x.awarded?(' • نقاط: '+x.awarded):''}</p>`}</div>`).join(''):'<p class="muted">لا توجد طلبات نقاط حمراء.</p>'}catch(e){box.textContent='🔴 '+e.message}}
async function reviewRedPointRequest(id,approve){const input=document.getElementById('redReqAward'+id),award=Math.floor(Number(input?.value)||0);if(!confirm(approve?'تأكيد تنفيذ طلب النقاط؟':'تأكيد رفض الطلب؟'))return;try{await api('/api/admin/red-points/review',{method:'POST',body:JSON.stringify({id,approve,award})});await loadAdminRedPointRequests()}catch(e){alert(e.message)}}
async function loadAdminRedVideos(){const box=document.getElementById('adminRedVideos');if(!box)return;try{const d=await api('/api/admin/red-videos');const arr=d.requests||[];box.innerHTML=arr.length?arr.map(x=>`<div class="file" style="margin-bottom:10px;display:block"><b>${escapeHtml(x.name||'فيديو')}</b><p class="muted">${escapeHtml(x.phone||x.uid)} • ${escapeHtml(x.note||'بدون ملاحظات')} • ${Math.round((x.size||0)/1024)} KB • ${escapeHtml(x.status)}</p><video controls playsinline src="/api/admin/red-videos/${encodeURIComponent(x.id)}/file" style="width:100%;max-height:280px"></video>${x.status==='pending'?`<div class="actions"><input id="redAward${escapeHtml(x.id)}" type="number" min="1" value="10" class="auth-input" style="max-width:130px" placeholder="عدد النقاط"><button class="primary" onclick="reviewRedVideo('${escapeHtml(x.id)}',true)">قبول وإضافة النقاط</button><button class="danger" onclick="reviewRedVideo('${escapeHtml(x.id)}',false)">رفض</button></div>`:`<p>النقاط الممنوحة: ${Number(x.awarded||0)} 🔴</p>`}</div>`).join(''):'<p class="muted">لا توجد فيديوهات قيد المراجعة.</p>'}catch(e){box.textContent='🔴 '+e.message}}
async function reviewRedVideo(id,approve){const award=Math.floor(Number(document.getElementById('redAward'+id)?.value)||0);if(approve&&(award<1||award>1000000)){alert('حدد نقاطًا حمراء من 1 إلى 1000000');return}if(!confirm(approve?`إضافة ${award} نقطة حمراء للمستخدم؟`:'رفض الفيديو؟'))return;try{await api('/api/admin/red-videos/review',{method:'POST',body:JSON.stringify({id,approve,award})});loadAdminRedVideos()}catch(e){alert(e.message)}}
async function loadAdminPayments(){const box=document.getElementById('adminPayments');if(!box)return;try{const d=await api('/api/admin/payments');const list=(d.payments||[]).slice(0,100);if(!list.length){box.innerHTML='<p class="muted">لا توجد طلبات دفع بعد.</p>';return}const lab={pending:'⏳ قيد المراجعة',approved:'✅ مقبول',rejected:'❌ مرفوض'};box.innerHTML=list.map(p=>`<div class="file" style="margin-bottom:8px"><span><b>${Number(p.coins).toLocaleString('en-US')} كوين — ${p.price} جنيه</b><span>${escapeHtml(p.email||p.uid)} · رقم العملية: <code>${escapeHtml(p.transactionRef)}</code> · ${escapeHtml(new Date(p.createdAt).toLocaleString('ar-EG'))}</span></span><span class="actions">${p.status==='pending'?`<button type="button" class="primary" data-pay="${escapeHtml(p.id)}" data-approve="1">✅ قبول</button><button type="button" class="danger" data-pay="${escapeHtml(p.id)}" data-approve="0">رفض</button>`:`<span class="generated-badge">${lab[p.status]||escapeHtml(p.status)}</span>`}</span></div>`).join('');box.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>reviewAdminPayment(b.dataset.pay,b.dataset.approve==='1',b))}catch(e){box.textContent='🔴 '+e.message}}
async function reviewAdminPayment(id,approve,btn){if(!confirm(approve?'تأكيد قبول الدفع وإضافة الكوينز للمستخدم؟':'تأكيد رفض الطلب؟'))return;btn.disabled=true;try{await api('/api/admin/payments/approve',{method:'POST',body:JSON.stringify({id,approve})});await loadAdminPayments()}catch(e){alert(e.message);btn.disabled=false}}
async function refreshApiHealth(){const box=document.getElementById('serverApiHealth');if(!box)return;box.textContent='⏳ جاري الفحص...';try{const d=await api('/api/health');box.innerHTML=`<div style="display:grid;gap:8px;margin-top:10px"><div>${d.geminiConfigured?'🟢':'🔴'} Gemini API: ${d.geminiConfigured?'مضبوط على السيرفر':'غير مضبوط — أضف GEMINI_API_KEY في إعدادات الاستضافة'}</div><div>${d.xkiroConfigured?'🟢':'🔴'} xKiro API: ${d.xkiroConfigured?'مضبوط على السيرفر':'غير مضبوط — أضف XKIRO_API_KEY في إعدادات الاستضافة'}</div><div>${d.ltxConfigured?'🟢':'🔴'} LTX API: ${d.ltxConfigured?'مضبوط على السيرفر':'غير مضبوط — أضف LTX_API_KEY في إعدادات الاستضافة'}</div><div>${d.apiframeConfigured?'🟢':'🔴'} Apiframe API: ${d.apiframeConfigured?'مضبوط على السيرفر':'غير مضبوط — أضف APIFRAME_API_KEY في إعدادات الاستضافة'}</div><div>${d.json2videoConfigured?'🟢':'🔴'} JSON2Video API: ${d.json2videoConfigured?'مضبوط على السيرفر':'غير مضبوط — أضف JSON2VIDEO_API_KEY في إعدادات الاستضافة'}</div><div>${d.json2videoTemplateConfigured?'🟢':'⚪'} JSON2Video Template: ${d.json2videoTemplateConfigured?'تم ضبط قالب افتراضي':'اختياري؛ غير مطلوب عند إرسال مشاهد مباشرة'}</div><div>${d.googleReady?'🟢':'🟡'} تسجيل الدخول بجوجل: ${d.googleReady?'مفعّل':'غير مفعّل — يحتاج FIREBASE_WEB_API_KEY وFIREBASE_AUTH_DOMAIN وFIREBASE_APP_ID'}</div><div>${d.persistentStorage?'🟢':'🟡'} التخزين: ${d.persistentStorage?'Firebase متصل':'تخزين محلي على السيرفر (قد يضيع عند إعادة النشر — فعّل Firebase)'}</div></div>`;const extra=document.getElementById('extraVideoProviders');if(extra)extra.innerHTML=`<div style="display:grid;gap:9px"><div>${d.magicHourConfigured?'🟢':'⚪'} Magic Hour — ${d.magicHourConfigured?'المفتاح موجود':'أضف MAGIC_HOUR_API_KEY عند توفر مفتاح'}</div><div>${d.tavusConfigured?'🟢':'⚪'} Tavus — ${d.tavusConfigured?'المفتاح موجود':'أضف TAVUS_API_KEY عند توفر مفتاح'}</div><div>${d.runwayConfigured?'🟢':'⚪'} Runway — ${d.runwayConfigured?'المفتاح موجود':'أضف RUNWAY_API_KEY عند توفر مفتاح'}</div><div>${d.wanConfigured?'🟢':'⚪'} Wan AI — ${d.wanConfigured?'المفتاح موجود':'أضف WAN_API_KEY عند توفر مفتاح'}</div></div>`}catch(e){box.textContent='🔴 تعذّر فحص السيرفر: '+e.message}}

initAuth().then(()=>{render();updateLoginUI();refreshShopContact()});

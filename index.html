oin-packages{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.coin-card{padding:24px;border-radius:24px;background:linear-gradient(160deg,#101f39,#091326);border:1px solid #ffffff12;text-align:center;box-shadow:0 18px 45px #0006}.coin-card.featured{border-color:#4e9bff77;box-shadow:0 0 0 1px #4e9bff22,0 22px 55px #0007}.coin-num{font-size:32px;font-weight:800;color:#fff}.coin-price{font-size:26px;color:#71c5ff;font-weight:800;margin:8px 0 18px}.review-hours{margin:14px auto;padding:13px 16px;max-width:1000px;border:1px solid #d6a84f88;border-radius:14px;background:linear-gradient(135deg,#2a2113aa,#101c30);color:#ffe3a0;line-height:1.8}.review-hours b{color:#ffd36a}.review-hours small{display:block;color:#c4b99c;margin-top:3px}.payment-box{max-width:760px;margin:22px auto;padding:24px;border-radius:24px;background:#08162b;border:1px solid #ffffff12}.cash-number{font-size:27px;letter-spacing:2px;color:#ff6b86;font-weight:900;background:#ff49620d;border:1px dashed #ff657766;padding:15px;border-radius:14px;text-align:center}.login-pill{display:flex;align-items:center;gap:8px}.login-pill button{background:#fff;color:#142033;border:0;border-radius:12px;padding:9px 13px;font-weight:700;cursor:pointer;font:inherit}.locked{opacity:.55;filter:saturate(.7)}.progress{height:10px;border-radius:99px;background:#ffffff18;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:linear-gradient(90deg,#1678ff,#7b4dff);transition:width .3s}.viewer .auth-card{max-height:92vh;overflow:auto}.file code{direction:ltr;unicode-bidi:embed}button:disabled{opacity:.6;cursor:not-allowed}

<div class="app">

<script>
const main=document.getElementById('main');
const points={get textContent(){return (document.getElementById('points')||{}).textContent||''},set textContent(v){const e=document.getElementById('points');if(e)e.textContent=v}};
const savedLang=localStorage.getItem('alhilal_ui_language')||'العربية';
let state={page:'home',projects:[],lang:savedLang};
try{state.projects=JSON.parse(localStorage.getItem('alhilal_projects')||'[]')}catch(e){state.projects=[]}
function persistProjects(){try{localStorage.setItem('alhilal_projects',JSON.stringify(state.projects))}catch(e){console.warn('project storage',e)}}
function stripProjectBinaries(value){if(Array.isArray(value))return value.map(stripProjectBinaries);if(value&&typeof value==='object'){const o={};for(const [k,v] of Object.entries(value)){if(['audioBase64','blobUrl'].includes(k))continue;if(typeof v==='string'&&v.startsWith('data:'))continue;o[k]=stripProjectBinaries(v)}return o}return value}
function legacy_addProjectRecord(type,name,desc,data,icon='📁'){const safeData=stripProjectBinaries(data||null);const rec={id:'p_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),type,name:name||'مشروع الهلال AI',date:new Date().toLocaleString('ar-EG'),desc:desc||'',icon,data:safeData};state.projects.unshift(rec);persistProjects();return rec}
function projectTypeLabel(t){return ({director:'المخرج الذكي',story:'قصة / بطاقة قصة',voice:'تعليق صوتي',image:'صورة',video:'فيديو',chat:'محادثة'})[t]||'مشروع'}
function openProjectRecord(i){const p=state.projects[i];if(!p)return;document.getElementById('projectViewer')?.remove();const v=document.createElement('div');v.className='viewer';v.id='projectViewer';let body='';try{if(p.type==='director'){const d=normalizeDirectorData(p.data?.data||p.data||{});body=directorSceneText(d)+'\n\n'+directorCharactersText(d)+'\n\n'+directorWorldText(d)}else if(p.type==='story'){const d=normalizeStoryData(p.data?.data||p.data||{});body=storyScenesText(d)+'\n\nالشخصيات\n'+storyCharactersText(d)+'\n\nالأماكن\n'+storyLocationsText(d)}else if(p.type==='voice'){body='النص:\n'+(p.data?.text||'')+'\n\nالصوت: '+(p.data?.voice||'')+'\nالنموذج: '+(p.data?.model||'')}else if(p.type==='image'){body='وصف الصورة:\n'+(p.data?.prompt||'')+'\n\nالنسبة: '+(p.data?.ratio||'')}else if(p.type==='video'){body='وصف الفيديو:\n'+(p.data?.prompt||'')+'\n\nالنموذج: '+(p.data?.model||'')+'\nالمدة: '+(p.data?.duration||p.data?.durationSeconds||'')+' ثانية\nالدقة: '+(p.data?.resolution||'')}else{body=typeof p.data==='string'?p.data:JSON.stringify(p.data||{},null,2)}}catch(e){body=JSON.stringify(p.data||{},null,2)}const img=(p.type==='image'&&/^https?:/i.test(p.data?.src||''))?`<img class="ai-image" src="${escapeHtml(p.data.src)}" alt="">`:'';const fname=String(p.name||'project').replace(/[^\w\u0600-\u06FF\-]+/g,'_');v.innerHTML=`<div class="viewer-card"><div class="viewer-head"><h3>${escapeHtml(p.name)}</h3><button class="viewer-close" type="button" id="pvClose">إغلاق</button></div><div class="viewer-body"><div class="viewer-section"><div class="generated-badge">${projectTypeLabel(p.type)} • ${escapeHtml(p.date||'')}</div>${img}<pre class="viewer-pre">${escapeHtml(body)}</pre></div><div class="mini-actions"><button type="button" class="gold" id="pvDownload">💾 تنزيل الملف</button><button type="button" id="pvPrint">🖨️ طباعة / PDF</button>${p.type==='director'||p.type==='story'?`<button type="button" class="gold" id="pvVideo">🎬 إنشاء فيديو من المشروع — 10 ثوانٍ</button>`:''}${['voice','image','video'].includes(p.type)?`<button type="button" id="pvOpen">فتح الأداة</button>`:''}</div></div></div>`;document.body.appendChild(v);v.addEventListener('click',e=>{if(e.target===v)v.remove()});v.querySelector('#pvClose').onclick=()=>v.remove();v.querySelector('#pvDownload').onclick=()=>downloadTextFile(fname+'.txt',body);v.querySelector('#pvPrint').onclick=()=>printStoryFile(p.name,body);const pv=v.querySelector('#pvVideo');if(pv)pv.onclick=()=>openVideoFromProject(i);const po=v.querySelector('#pvOpen');if(po)po.onclick=()=>{v.remove();nav(p.type)}}

async function callGemini(prompt,opts={}){
 const key=getGeminiKey();
 if(!key) throw new Error('لم يتم إدخال مفتاح Gemini API من الإعدادات.');
 const preferred=opts.model||getGeminiModel();
 const models=[preferred,...(preferred==='gemini-3.8-flash'?['gemini-3.7-flash']:[])].filter((m,i,a)=>a.indexOf(m)===i);
 let lastError='تعذر الاتصال بـ Gemini API';
 for(const model of models){
  for(let attempt=0;attempt<3;attempt++){
   try{
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{
     method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},
     body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],...(opts.generationConfig?{generationConfig:opts.generationConfig}:{})})
    });
    const data=await res.json().catch(()=>({}));
    if(res.ok){
      const text=(data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('\n').trim();
      if(text)return text;
      throw new Error('لم يرجع النموذج نصًا.');
    }
    const status=res.status;
    lastError=data?.error?.message||`خطأ Gemini (${status})`;
    if(status===429||status===500||status===502||status===503||status===504){
      await new Promise(r=>setTimeout(r,1200*(attempt+1)));
      continue;
    }
    break;
   }catch(e){
    lastError=e?.message||lastError;
    if(attempt<2){await new Promise(r=>setTimeout(r,1200*(attempt+1)));continue;}
   }
  }
 }
 throw new Error(lastError);
}

async function callXKiro(prompt,opts={}){
 const key=getXKiroKey(); if(!key) throw new Error('لم يتم إدخال مفتاح xKiro API من الإعدادات.');
 const model=opts.model||getXKiroModel();
 const res=await fetch('https://api.xkiro.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model,messages:[{role:'user',content:prompt}],stream:false,max_tokens:opts.max_tokens||8000})});
 const data=await res.json().catch(()=>({})); if(!res.ok) throw new Error(data?.error?.message||`خطأ xKiro (${res.status})`);
 return data?.choices?.[0]?.message?.content||data?.choices?.[0]?.text||'';
}
async function loadXKiroModels(){
 const key=getXKiroKey(); if(!key) throw new Error('أدخل مفتاح xKiro أولًا.');
 const [chatRes,imageRes]=await Promise.all([fetch('https://api.xkiro.com/v1/models',{headers:{Authorization:'Bearer '+key}}),fetch('https://api.xkiro.com/v1/models?modality=image',{headers:{Authorization:'Bearer '+key}})]);
 const chatData=await chatRes.json().catch(()=>({})), imageData=await imageRes.json().catch(()=>({}));
 if(!chatRes.ok) throw new Error(chatData?.error?.message||`فشل جلب نماذج xKiro (${chatRes.status})`);
 const chats=(chatData.data||[]).filter(m=>isXKiroChatModel(m.id)); const images=(imageData.data||[]);
 localStorage.setItem(XKIRO_MODELS_STORAGE,JSON.stringify(chats));
 localStorage.setItem(XKIRO_IMAGE_MODELS_STORAGE,JSON.stringify(images));
 if(images.length && !images.some(m=>m.id===getXKiroImageModel())) localStorage.setItem(XKIRO_IMAGE_MODEL_STORAGE,images.find(m=>/free|sensenova|image/i.test(m.id))?.id||images[0].id);
 renderXKiroModelOptions('xkiroModel'); renderXKiroImageOptions('xkiroImageModel'); ['chatModel','directorModel','storyModel'].forEach(renderAIModelOptions);
 return {chats,images};
}

async function generateImageWithFallback(prompt,aspectRatio='1:1'){
 const key=getGeminiKey();
 if(!key)throw new Error('لم يتم إدخال مفتاح Gemini API.');
 const preferred=getGeminiImageModel();
 const models=[preferred,...(preferred==='gemini-3.1-flash-image'?['gemini-3-pro-image']:['gemini-3.1-flash-image'])].filter((m,i,a)=>a.indexOf(m)===i);
 const ratio=aspectRatio==='16:9'?'16:9':'1:1';
 let lastError='تعذر توليد الصورة';
 for(const model of models){
  try{
   const res=await fetch('https://generativelanguage.googleapis.com/v1beta/interactions',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-goog-api-key':key},
    body:JSON.stringify({
      model,
      input:prompt,
      response_format:{type:'image',mime_type:'image/jpeg',aspect_ratio:ratio,image_size:'1K'}
    })
   });
   const data=await res.json().catch(()=>({}));
   if(!res.ok){lastError=data?.error?.message||`خطأ توليد الصورة (${res.status})`;continue}
   const out=data.output_image;
   if(out?.data)return `data:${out.mime_type||out.mimeType||'image/png'};base64,${out.data}`;
   for(const step of (data.steps||[])){
    for(const block of (step.content||[])){
     if(block?.type==='image'&&block?.data)return `data:${block.mime_type||'image/png'};base64,${block.data}`;
    }
   }
   lastError='Gemini استجاب لكن لم يُرجع بيانات صورة.';
  }catch(e){lastError=e?.message||lastError}
 }
 throw new Error(lastError);
}

async function generateDirectorImages(data,resultEl){
 const jobs=[];
 data.characters.forEach((x,i)=>jobs.push({kind:'character',index:i,label:`الشخصية ${x.name||i+1}`,prompt:`شخصية سينمائية ${x.name||''}. ${x.description||''}`}));
 data.locations.forEach((x,i)=>jobs.push({kind:'location',index:i,label:`المكان ${x.name||i+1}`,prompt:`مكان سينمائي ${x.name||''}. ${x.description||''}`}));
 const total=jobs.length;
 let done=0,failed=0;
 const CONCURRENCY=2;
 if(resultEl) resultEl.innerHTML=`<section class="panel" style="margin-top:18px"><h3>🎨 جاري إنشاء الصور تلقائيًا...</h3><div class="progress"><div id="directorImageProgress" style="width:0%"></div></div><p id="directorImageStatus" class="muted">0 من ${total} مكتملة</p></section>`;

 async function runJob(job){
  try{
   const img=await generateImageWithFallback(job.prompt,job.kind==='character'?'1:1':'16:9');
   if(job.kind==='character') data.characters[job.index].image_data=img;
   else if(job.kind==='location') data.locations[job.index].image_data=img;
  }catch(e){
   failed++;
  }finally{
   done++;
   const pct=Math.round((done/Math.max(total,1))*100);
   const bar=document.getElementById('directorImageProgress');
   const status=document.getElementById('directorImageStatus');
   if(bar) bar.style.width=pct+'%';
   if(status) status.textContent=`${done} من ${total} مكتملة`;
  }
 }
 for(let i=0;i<jobs.length;i+=CONCURRENCY){ await Promise.all(jobs.slice(i,i+CONCURRENCY).map(runJob)); }
 return {done,failed,total};
}

 v.innerHTML=`<div class="auth-card" style="max-width:460px;width:100%;background:#101c30;padding:24px;border-radius:22px;border:1px solid #438cff55"><button class="secondary" style="float:left" onclick="document.getElementById('phoneAuthModal').remove()">✕</button><h2 style="color:#fff;margin-top:0">حساب الهلال AI</h2><div class="auth-tabs"><button id="authLoginTab" class="${mode==='login'?'primary':'secondary'}" onclick="setAuthMode('login')">تسجيل الدخول</button><button id="authRegisterTab" class="${mode==='register'?'primary':'secondary'}" onclick="setAuthMode('register')">حساب جديد</button></div><div id="authNameWrap" style="display:${mode==='register'?'block':'none'}"><label>الاسم</label><input id="authName" class="auth-input" placeholder="اكتب اسمك"></div><label>رقم الهاتف المصري</label><input id="authPhone" class="auth-input" placeholder="01xxxxxxxxx"><label>كلمة المرور</label><input id="authPassword" class="auth-input" type="password" placeholder="كلمة المرور"><button class="primary" id="authSubmitBtn" style="width:100%;margin-top:16px" onclick="submitPhoneAuth(window.__authMode||'login')">${mode==='register'?'إنشاء الحساب':'تسجيل الدخول'}</button><div id="phoneAuthStatus" class="image-status" style="margin-top:12px"></div></div>`;document.body.appendChild(v);window.__authMode=mode;
}
function setAuthMode(mode){window.__authMode=mode;const reg=mode==='register';document.getElementById('authNameWrap').style.display=reg?'block':'none';document.getElementById('authSubmitBtn').textContent=reg?'إنشاء الحساب':'تسجيل الدخول';}
async function logoutUser(){authToken=null;currentUser=null;window.__member=null;localStorage.removeItem('alhilal_auth_token');updateLoginUI();nav('home')}
async function submitPhoneAuth(mode){const status=document.getElementById('phoneAuthStatus'),phone=(document.getElementById('authPhone')?.value||'').trim(),password=document.getElementById('authPassword')?.value||'',name=(document.getElementById('authName')?.value||'').trim();try{const body={phone,password,browserId:getBrowserId()};if(mode==='register')body.name=name||'عضو';const d=await api('/api/auth/'+mode,{method:'POST',body:JSON.stringify(body)});authToken=d.token;localStorage.setItem('alhilal_auth_token',authToken);currentUser={uid:d.user.uid,name:d.user.name};window.__member=d.user;updateLoginUI();document.getElementById('phoneAuthModal')?.remove();render()}catch(e){status.textContent='🔴 '+e.message}}
function requireLogin(){if(currentUser&&authToken)return true;openLogin('login');throw new Error('سجّل الدخول أولًا.')}
function accountPage(){if(!currentUser){main.innerHTML=`<section class="panel"><h2>👤 حساب الهلال AI</h2><button class="primary" onclick="openLogin('login')">تسجيل الدخول</button></section>`;return}const u=window.__member||{};main.innerHTML=`<div class="page-title"><div><h2>👤 حسابي</h2></div></div><section class="member-grid"><div class="member-card"><div class="avatar">👤</div><h2 style="color:#fff">${escapeHtml(currentUser.name)}</h2><p class="muted">الرصيد: ${u.points??0} كوين</p></div></section>`}
function pointsPage(){main.innerHTML=header('🪙 الباقات والكوينز','رصيدك ومتطلبات الاستخدام')+`<section class="coin-packages"><article class="coin-card"><div class="coin-num">100 كوين</div><h3>باقة تجريبية</h3><div class="coin-price">10 جنيه</div><button class="primary" onclick="openPayment('p_100',100,10)">شراء الباقة</button></article></section>`}
function earnPage(){const red=Number(window.__member?.redPoints||0);main.innerHTML=`<div class="page-title"><div><h2>💰 الربح مع الهلال</h2><p>النقاط الحمراء وبيع الفيديوهات</p></div><span class="generated-badge">رصيدك: <b style="color:#ff526d">${red} 🔴</b></span></div><section class="payment-box"><h3>🎬 بيع الفيديوهات مقابل نقاط حمراء</h3><label>رقم التواصل</label><input id="redVideoContact" class="auth-input" value="${escapeHtml(window.__member?.phone||'')}" placeholder="01xxxxxxxxx"><label>ملف الفيديو</label><input id="redVideoUpload" type="file" accept="video/*" class="auth-input"><button class="primary" style="margin-top:12px" onclick="submitRedVideo()">إرسال الفيديو</button><button class="secondary" style="margin-top:8px" onclick="openRedVideoWhatsApp()">واتساب</button><p id="redVideoStatus" class="muted"></p></section>`}
function openPayment(id,coins,price){alert('باقة رقم: '+id)}
function home(){main.innerHTML=`<section class="hero"><div class="moon"></div><div class="hero-content"><div class="generated-badge">AI CREATIVE STUDIO</div><h1>اصنع فكرتك مع هلال AI</h1><div class="goldline"></div><p>من القصة إلى الصورة والفيديو والتعليق الصوتي — كل أدوات الإبداع في مساحة واحدة.</p><div class="feature-grid"><div class="feature"><strong>🎨 صور مجانية</strong>أنشئ صورك بدون خصم.</div><div class="feature"><strong>🎬 فيديو ذكي</strong>توليد فيديو حقيقي عبر LTX.</div><div class="feature"><strong>🎙️ صوت احترافي</strong>تعليق صوتي متعدد اللغات.</div></div><div class="actions" style="justify-content:center;margin-top:26px"><button class="primary" data-nav="studio">ابدأ صناعة المحتوى</button><button class="secondary" data-nav="business">📁 مشاريعي</button></div></div></section>`}
function business(){const cards=state.projects.map((x,i)=>`<article class="skin-project"><h4>${x.icon||'📁'} ${escapeHtml(x.name)}</h4><small>${projectTypeLabel(x.type)}</small><div class="actions"><button class="secondary" onclick="openProjectRecord(${i})">📂 فتح</button><button class="danger" onclick="deleteProject(${i})">حذف</button></div></article>`).join('');main.innerHTML=`<div class="page-title"><div><h2>💼 أعمالي</h2></div><button class="primary" onclick="nav('studio')">+ مشروع جديد</button></div><section style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px">${cards||`<div class="panel" style="grid-column:1/-1;text-align:center"><h3>لا توجد مشاريع</h3></div>`}</section>`}
function studio(){main.innerHTML=header('الاستوديو','اختر أداة الإنتاج')+`<section class="panel"><div class="studio-grid">${tools.map(t=>`<button class="tool" data-tool="${t[0]}"><span class="ico">${t[1]}</span><span><h3>${t[2]}</h3><p>${t[3]}</p></span></button>`).join('')}</div></section>`;document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>nav(b.dataset.tool))}
function render(){let p=state.page;if(p==='home')home();else if(p==='language')language();else if(p==='studio')studio();else if(p==='business')business();else if(p==='points')pointsPage();else if(p==='earn')earnPage();else if(p==='account')accountPage();else if(p==='settings')settings();else if(p==='chat')chat();else if(p==='director')director();else if(p==='story')story();else if(p==='image')imageGen();else if(p==='video')videoGen();else if(p==='montage')montagePage();else if(p==='voice')voice();updateLoginUI();applyLocale()}
async function addProjectRecord(type,name,desc,data,icon='📁'){const safeData=stripProjectBinaries(data||null);const rec={id:'p_'+Date.now(),type,name:name||'مشروع',date:new Date().toLocaleString('ar-EG'),desc:desc||'',icon,data:safeData};state.projects.unshift(rec);persistProjects();return rec}
function deleteProject(i){state.projects.splice(i,1);persistProjects();render()}
function settings(){main.innerHTML=header('إعدادات API','الإعدادات العامة')+`<section class="panel"><p class="muted">إعدادات النظام والسيرفر.</p></section>`}

const _oldNav=nav; nav=function(page){state.page=page;render();window.scrollTo({top:0,behavior:'smooth'})}
initAuth().then(()=>{render();updateLoginUI()});
</script>
</body></html>
